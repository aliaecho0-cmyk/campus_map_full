<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>加载界面视觉预览</title>
  <style>
    @font-face {
      font-family: Fusion Pixel;
      src: url('./src/assets/fonts/fusion-pixel-12px-proportional-latin.otf.woff2') format('woff2');
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #2a1c3d;
      color: #2f2438;
      font-family: Fusion Pixel, monospace;
    }
    .stage {
      position: relative;
      width: min(100%, 430px);
      height: 100dvh;
      min-height: 600px;
      margin: auto;
      overflow: hidden;
      background: #2a1c3d;
    }
    .device {
      position: absolute;
      width: max(100%, calc(100dvh * 0.5628));
      aspect-ratio: 941 / 1672;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .device > img { display: block; width: 100%; height: 100%; }
    .screen {
      position: absolute;
      left: 17.5%;
      top: 15.25%;
      width: 57.4%;
      height: 55.85%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8%;
      background: white;
      border-radius: 1%;
    }
    .label {
      color: #fff7ff;
      font-size: clamp(18px, 5.4vw, 24px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: .015em;
      white-space: nowrap;
      -webkit-text-stroke: 1px #2f2438;
      paint-order: stroke fill;
      text-shadow:
        1px 1px 0 #2f2438,
        2px 2px 0 #925cd1,
        3px 3px 0 #925cd1,
        4px 4px 0 #6d3fa8,
        5px 5px 0 #2f2438;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3%;
      width: 88%;
    }
    .progress-track {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 1px;
      flex: 1;
      height: clamp(16px, 4.6vw, 21px);
      padding: 3px;
      border: 3px solid #2f2438;
      background: #fff;
      box-shadow: 2px 2px 0 #c386db;
    }
    .pixel { background: #fff; }
    .pixel.filled { background: #925cd1; }
    .pixel.filled:nth-child(4n) { background: #a574dc; }
    .pixel.filled:nth-child(7n) { background: #6d3fa8; }
    .percent {
      width: 4ch;
      font-size: clamp(10px, 3vw, 13px);
      white-space: nowrap;
      text-align: right;
    }
    .control {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 2px solid #2f2438;
      background: #eef1ee;
      box-shadow: 4px 4px 0 #925cd1;
      font-size: 12px;
    }
    .control input { accent-color: #925cd1; }
    @media (max-width: 600px) { .control { display: none; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="加载界面视觉预览">
    <div class="device">
      <img src="./地图相关素材/游戏机模板.webp" alt="百团大战游戏机" />
      <div class="screen">
        <div class="label">Loading...</div>
        <div class="progress-row">
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
          <span class="percent"></span>
        </div>
      </div>
    </div>
  </main>
  <label class="control">预览进度 <input type="range" min="0" max="100" value="65" /></label>
  <script>
    const slider = document.querySelector('input');
    const track = document.querySelector('.progress-track');
    const percent = document.querySelector('.percent');
    const initial = Number(new URLSearchParams(location.search).get('progress'));
    if (Number.isFinite(initial) && location.search.includes('progress=')) {
      slider.value = Math.max(0, Math.min(100, initial));
    }
    function render() {
      const value = Number(slider.value);
      const filled = Math.round(value / 5);
      track.innerHTML = Array.from({ length: 20 }, (_, i) => `<span class="pixel${i < filled ? ' filled' : ''}"></span>`).join('');
      track.setAttribute('aria-valuenow', String(value));
      percent.textContent = `${value}%`;
    }
    slider.addEventListener('input', render);
    render();
  </script>
</body>
</html>
