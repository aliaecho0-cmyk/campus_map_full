<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1c3d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232a1c3d'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23e5b5f1'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23c386db'/%3E%3C/svg%3E"
    />
    <link rel="preload" as="image" fetchpriority="high" href="./地图相关素材/游戏机模板.webp" />
    <title>百团大战 · 活动导览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #2a1c3d; }
      #entry-loading { position: fixed; inset: 0; z-index: 12000; overflow: hidden; background: #2a1c3d; transition: opacity 180ms linear; }
      #entry-loading.is-leaving { opacity: 0; pointer-events: none; }
      .entry-stage { position: relative; width: min(100%, 430px); height: 100%; height: 100dvh; margin: auto; overflow: hidden; }
      .entry-device { position: absolute; left: 50%; top: 50%; width: max(100%, calc(100vh * .5628)); width: max(100%, calc(100dvh * .5628)); aspect-ratio: 941 / 1672; transform: translate(-50%, -50%); }
      .entry-device > img { display: block; width: 100%; height: 100%; }
      .entry-screen { position: absolute; left: 17.5%; top: 15.25%; width: 57.4%; height: 55.85%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8%; background: #fff; border: 2px solid #2f2438; border-radius: 1%; }
      .entry-label { color: #fff7ff; font: 900 clamp(18px, 5.4vw, 24px)/1 monospace; letter-spacing: .015em; white-space: nowrap; -webkit-text-stroke: 1px #2f2438; paint-order: stroke fill; text-shadow: 1px 1px 0 #2f2438, 2px 2px 0 #925cd1, 3px 3px 0 #925cd1, 4px 4px 0 #6d3fa8, 5px 5px 0 #2f2438; }
      .entry-progress-row { display: flex; align-items: center; justify-content: center; gap: 3%; width: 88%; }
      .entry-progress { flex: 1; height: clamp(16px, 4.6vw, 21px); padding: 3px; border: 3px solid #2f2438; background: #fff; box-shadow: 2px 2px 0 #c386db; }
      .entry-progress-fill { display: block; width: 0; height: 100%; background: repeating-linear-gradient(90deg, #925cd1 0 10px, #a574dc 10px 12px, #fff 12px 14px); transition: width 180ms steps(20, end); }
      .entry-percent { width: 4ch; color: #2f2438; font: 700 clamp(10px, 3vw, 13px)/1 monospace; text-align: right; }
      .entry-retry { display: none; margin-top: 4%; padding: 6px 10px; border: 2px solid #2f2438; background: #e5b5f1; color: #2f2438; font: 700 12px monospace; }
      #entry-loading.has-error .entry-retry { display: block; }
      @media (prefers-reduced-motion: reduce) { #entry-loading, .entry-progress-fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="entry-loading" role="status" aria-live="polite" aria-label="Loading... 0%">
      <div class="entry-stage">
        <div class="entry-device">
          <img id="entry-console" src="./地图相关素材/游戏机模板.webp" alt="" fetchpriority="high" />
          <div class="entry-screen">
            <div class="entry-label">Loading...</div>
            <div class="entry-progress-row">
              <div class="entry-progress" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="entry-progress-fill"></span></div>
              <span class="entry-percent">0%</span>
            </div>
            <button class="entry-retry" type="button" onclick="location.reload()">重新加载</button>
          </div>
        </div>
      </div>
    </div>
    <div id="app">
      <div id="header"></div>
      <div id="page"></div>
      <div id="tabbar"></div>
    </div>
    <div id="overlay"></div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
